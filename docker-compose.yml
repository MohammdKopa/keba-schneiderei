services:
  keba-schneiderei:
    build: .
    container_name: keba-schneiderei
    restart: always
    ports:
      - "3302:3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
    # SHOP_PIN and SESSION_SECRET for the /laden partner desk
    env_file: .env
    volumes:
      - keba-data:/app/data

volumes:
  keba-data:
